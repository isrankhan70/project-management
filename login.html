<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-200">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">Admin Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">Gmail Address</label>
                <input type="email" id="email" required class="w-full border p-2 rounded bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Password</label>
                <input type="password" id="password" required class="w-full border p-2 rounded bg-gray-50 focus:bg-white">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 mt-4 transition">Login</button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">Don't have an account? <a href="signup.html" class="text-blue-600 font-bold hover:underline">Sign up here</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY",
            projectId: "project-management-70-8277e",
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Checking Permission..."; btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    const user = userCredential.user;
                    const docSnap = await getDoc(doc(db, "users", user.uid));

                    if (docSnap.exists() && docSnap.data().permissions) {
                        const perms = docSnap.data().permissions;
                        // Route user based on their active permissions
                        if (perms.dashboard) window.location.href = "dashboard.html";
                        else if (perms.ticketEntry) window.location.href = "index.html";
                        else if (perms.ticketRegister) window.location.href = "register.html";
                        else if (perms.permissionsPage) window.location.href = "permissions.html";
                        else {
                            await signOut(auth);
                            alert("Your account has no access permissions yet. Please contact Admin.");
                            btn.innerText = "Login"; btn.disabled = false;
                        }
                    } else {
                        window.location.href = "dashboard.html"; // Fallback for old admins
                    }
                })
                .catch(() => {
                    alert("Wrong Email or Password!");
                    btn.innerText = "Login"; btn.disabled = false;
                });
        });
    </script>
</body>
</html>

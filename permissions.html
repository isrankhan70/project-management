<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Permissions - ERP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-sidebar { background-color: #0b5e5e; }
        .bg-sidebar-hover { background-color: #084949; }
        .text-sidebar-text { color: #a1caca; }
        .dropdown-menu { display: none; }
        .dropdown-menu.open { display: block; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50 font-sans hidden" id="mainContent">

    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar text-white shadow-xl flex-shrink-0 flex flex-col z-20 transition-all duration-300">
        
        <div class="p-4 border-b border-gray-600 flex items-center gap-3 bg-sidebar-hover cursor-pointer">
            <img src="https://ui-avatars.com/api/?name=Admin+User&background=ffffff&color=0b5e5e&rounded=true" alt="User" class="w-10 h-10 rounded-full border-2 border-white">
            <div>
                <h3 id="userEmailDisplay" class="font-bold text-sm truncate w-40">Loading...</h3>
                <p class="text-xs text-sidebar-text">Administrator</p>
            </div>
            <i class="fa-solid fa-chevron-down text-xs ml-auto"></i>
        </div>

        <div class="px-4 py-2 text-xs font-bold text-sidebar-text tracking-wider mt-2">MENU</div>

        <nav class="flex-1 overflow-y-auto pb-4">
            
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sidebar-text hover:text-white hover:bg-sidebar-hover transition">
                <i class="fa-solid fa-house w-5 text-center"></i>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>

            <!-- Ticket Module -->
            <div class="nav-item">
                <button onclick="toggleDropdown('adminMenu', this)" class="w-full flex items-center justify-between px-4 py-3 text-sidebar-text hover:text-white hover:bg-sidebar-hover transition">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-ticket w-5 text-center"></i>
                        <span class="font-semibold text-sm">Ticket</span>
                    </div>
                    <i class="fa-solid fa-angle-down text-xs transition-transform duration-200"></i>
                </button>
                <div id="adminMenu" class="dropdown-menu bg-sidebar-hover pl-12 py-1">
                    <a href="index.html" class="block py-2 text-sm text-sidebar-text hover:text-white">📝 Ticket Entry</a>
                    <a href="register.html" class="block py-2 text-sm text-sidebar-text hover:text-white">📋 Ticket Register</a>
                </div>
            </div>

            <!-- User Management Module (Active) -->
            <div class="nav-item">
                <button onclick="toggleDropdown('userMenu', this)" class="w-full flex items-center justify-between px-4 py-3 hover:text-white hover:bg-sidebar-hover transition text-white bg-sidebar-hover">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-user-shield w-5 text-center"></i>
                        <span class="font-semibold text-sm">User Management</span>
                    </div>
                    <i class="fa-solid fa-angle-down text-xs transition-transform duration-200" style="transform: rotate(180deg);"></i>
                </button>
                <div id="userMenu" class="dropdown-menu bg-sidebar-hover pl-12 py-1 open">
                    <a href="permissions.html" class="block py-2 text-sm text-white font-bold border-l-2 border-white pl-2 ml-[-10px]">🔐 Permissions</a>
                </div>
            </div>
            
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        
        <!-- Top Navbar -->
        <header class="bg-white h-14 border-b flex items-center justify-between px-4 shadow-sm z-10 shrink-0">
            <div class="flex items-center gap-2 text-sm text-gray-500">
                <i class="fa-solid fa-house"></i>
                <i class="fa-solid fa-chevron-right text-xs"></i>
                <span>User Management</span>
                <i class="fa-solid fa-chevron-right text-xs"></i>
                <span class="font-semibold text-gray-700">Permissions</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="border-l pl-4 border-gray-300">
                    <button id="logoutBtn" class="bg-gray-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-sm font-bold transition flex items-center gap-2">
                        <i class="fa-solid fa-power-off"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Permissions Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-6xl mx-auto">
                
                <div class="bg-white p-5 rounded-t-lg shadow-sm border border-gray-200 border-b-0 flex items-center gap-3 border-t-4 border-t-[#0b5e5e]">
                    <div class="bg-[#e6f2f2] p-2 rounded-lg text-[#0b5e5e]">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">User Access & Permissions</h2>
                        <p class="text-xs text-gray-500">Grant or revoke website access for users.</p>
                    </div>
                </div>

                <div class="bg-white rounded-b-lg shadow-sm border border-t-0 border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto p-4">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead class="bg-gray-100 text-gray-600 text-xs uppercase font-bold">
                                <tr>
                                    <th class="p-4 border-b">User Email</th>
                                    <th class="p-4 border-b">System Access Status</th>
                                    <th class="p-4 border-b">Admin Action</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody" class="divide-y divide-gray-100 text-sm">
                                <tr><td colspan="3" class="p-8 text-center text-gray-500 font-bold">Loading Users...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        function toggleDropdown(menuId, btn) {
            const menu = document.getElementById(menuId);
            const icon = btn.querySelector('.fa-angle-down');
            if(menu.classList.contains('open')) {
                menu.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                menu.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY",
            authDomain: "project-management-70-8277e.firebaseapp.com",
            projectId: "project-management-70-8277e",
            storageBucket: "project-management-70-8277e.firebasestorage.app",
            messagingSenderId: "178430900706",
            appId: "1:178430900706:web:3085f215cb02b840bfa1bb"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("login.html");
            } else {
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.replace("login.html"); });
        });

        // Load Users Data
        onSnapshot(collection(db, "users"), (snapshot) => {
            const tbody = document.getElementById('userTableBody'); 
            tbody.innerHTML = '';
            
            if (snapshot.empty) return tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-500 font-bold">No users found</td></tr>`;
            
            snapshot.forEach((docSnap) => {
                const user = docSnap.data();
                const userId = docSnap.id;
                const isApproved = user.approved === true;
                
                const statusHtml = isApproved 
                    ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-check mr-1"></i> Access Granted</span>`
                    : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-lock mr-1"></i> Access Blocked</span>`;
                
                const actionBtn = isApproved
                    ? `<button onclick="toggleUserStatus('${userId}', false)" class="text-red-600 hover:text-red-800 font-bold text-sm bg-red-50 px-4 py-2 rounded transition border border-red-200 shadow-sm"><i class="fa-solid fa-ban mr-1"></i> Revoke Access</button>`
                    : `<button onclick="toggleUserStatus('${userId}', true)" class="text-white bg-green-600 hover:bg-green-700 font-bold text-sm px-4 py-2 rounded shadow-sm transition"><i class="fa-solid fa-unlock mr-1"></i> Grant Access</button>`;

                tbody.innerHTML += `<tr>
                    <td class="p-4 font-semibold text-gray-700 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">${user.email.charAt(0).toUpperCase()}</div>
                        ${user.email}
                    </td>
                    <td class="p-4">${statusHtml}</td>
                    <td class="p-4">${actionBtn}</td>
                </tr>`;
            });
        });

        window.toggleUserStatus = async function(userId, status) {
            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, { approved: status });
            } catch(e) {
                alert("Error updating status. Check connection.");
            }
        };
    </script>
</body>
</html>

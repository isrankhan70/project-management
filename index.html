<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head remains same as before -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Entry - ERP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-sidebar { background-color: #0b5e5e; }
        .bg-sidebar-hover { background-color: #084949; }
        .toast { transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; transform: translateY(100%); }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50 font-sans hidden" id="mainContent">

    <aside class="w-64 bg-sidebar text-white shadow-xl flex-shrink-0 flex flex-col z-20 transition-all duration-300">
        <div class="p-4 border-b border-gray-600 flex items-center gap-3 bg-sidebar-hover">
            <div class="w-10 h-10 rounded-full bg-white text-[#0b5e5e] flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-user"></i></div>
            <div><h3 id="userEmailDisplay" class="font-bold text-sm truncate w-40">Loading...</h3></div>
        </div>
        <div class="px-4 py-2 text-xs font-bold text-[#a1caca] tracking-wider mt-2">MENU</div>
        <nav class="flex-1 overflow-y-auto pb-4">
            <a href="dashboard.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-house w-5"></i> Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-white font-bold border-l-4 border-white bg-sidebar-hover"><i class="fa-solid fa-plus w-5"></i> Ticket Entry</a>
            <a href="register.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-list w-5"></i> Ticket Register</a>
            <a href="permissions.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-lock w-5"></i> Permissions</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="bg-white h-14 border-b flex items-center justify-between px-4 shadow-sm z-10 shrink-0">
            <div class="flex items-center gap-2 text-sm text-gray-500"><i class="fa-solid fa-house"></i><i class="fa-solid fa-chevron-right text-xs"></i><span class="font-semibold text-gray-700">Ticket Entry</span></div>
            <button id="logoutBtn" class="bg-gray-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-sm font-bold transition">Logout</button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-5xl mx-auto">
                <div class="bg-white p-5 rounded-t-lg shadow-sm border border-gray-200 border-b-0 flex items-center gap-3 border-t-4 border-t-[#0b5e5e]">
                    <div class="bg-[#e6f2f2] p-2 rounded-lg text-[#0b5e5e]"><i class="fa-solid fa-file-signature text-xl"></i></div>
                    <div><h2 class="text-lg font-bold text-gray-800">New Ticket Entry</h2><p class="text-xs text-gray-500">Submit a new Ticket or support request to the system.</p></div>
                </div>

                <section class="bg-white rounded-b-lg shadow-sm border border-gray-200 p-6">
                    <form id="TicketForm" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Ticket ID</label><input type="text" id="TicketId" value="Auto Serial TC-..." readonly class="w-full border p-2.5 rounded bg-gray-100 text-gray-500 cursor-not-allowed font-semibold focus:outline-none"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Category / Module <span class="text-red-500">*</span></label><input type="text" id="category" required class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Page / Location</label><input type="text" id="page" class="w-full border border-gray-300 p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Raised Date & Time <span class="text-red-500">*</span></label><input type="datetime-local" id="raisedDateTime" required class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Respond Date & Time</label><input type="datetime-local" id="respondDateTime" class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Solved Date & Time</label><input type="datetime-local" id="solvedDateTime" class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Ticket Description <span class="text-red-500">*</span></label><textarea id="description" required rows="4" class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none resize-none"></textarea></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Remarks / Resolution</label><textarea id="remarks" rows="4" class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none resize-none"></textarea></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div><label class="block text-sm font-bold text-gray-700 mb-1">Entry By (Name) <span class="text-red-500">*</span></label><input type="text" id="entryBy" required class="w-full border p-2.5 rounded focus:ring-2 focus:ring-[#0b5e5e] focus:outline-none"></div>
                        </div>
                        <div class="flex justify-end pt-5 border-t border-gray-100 mt-6">
                            <button type="submit" id="submitBtn" class="px-6 py-2.5 bg-[#0b5e5e] text-white rounded font-bold hover:bg-[#084949] flex items-center gap-2 shadow-md transition"><i class="fa-solid fa-floppy-disk"></i> <span id="btnText">Save Ticket</span></button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <div id="toast" class="toast fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 font-bold flex items-center gap-2"><i class="fa-solid fa-circle-check"></i> <span>Success!</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, getDoc, doc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY", projectId: "project-management-70-8277e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const issuesCol = collection(db, "issues");

        // Page Lock Logic
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace("login.html"); return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().permissions && userDoc.data().permissions.ticketEntry === true) {
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
            } else {
                alert("System Access Denied: You do not have permission to view the Ticket Entry page.");
                window.location.replace("login.html");
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth).then(() => { window.location.replace("login.html"); }); });

        document.getElementById('TicketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); const btnText = document.getElementById('btnText');
            btn.disabled = true; btnText.innerText = "Saving...";
            
            try {
                // Serial ID Logic (TC-1, TC-2)
                let nextIdNumber = 1;
                const q = query(issuesCol, orderBy("createdAt", "desc"), limit(1));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const lastTicket = querySnapshot.docs[0].data();
                    if (lastTicket.issueId && lastTicket.issueId.includes("-")) {
                        const lastNumber = parseInt(lastTicket.issueId.split("-")[1]);
                        if (!isNaN(lastNumber)) nextIdNumber = lastNumber + 1;
                    }
                }
                const autoTicketId = "TC-" + nextIdNumber;
                const entryDateTime = new Date().toLocaleString('en-GB');

                await addDoc(issuesCol, {
                    issueId: autoTicketId, 
                    category: document.getElementById('category').value,
                    page: document.getElementById('page').value,
                    raisedDateTime: document.getElementById('raisedDateTime').value.replace('T', ' '),
                    respondDateTime: document.getElementById('respondDateTime').value.replace('T', ' ') || "-",
                    solvedDateTime: document.getElementById('solvedDateTime').value.replace('T', ' ') || "-",
                    description: document.getElementById('description').value,
                    remarks: document.getElementById('remarks').value,
                    entryBy: document.getElementById('entryBy').value,
                    entryDateTime: entryDateTime,
                    createdAt: serverTimestamp()
                });
                
                const toast = document.getElementById('toast'); toast.className = "toast fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 font-bold flex items-center gap-2 show";
                setTimeout(() => toast.classList.remove('show'), 3000);
                document.getElementById('TicketForm').reset();
                setTimeout(() => { window.location.href = "register.html"; }, 1000);
                
            } catch (err) { alert("Error saving data!"); } 
            finally { btn.disabled = false; btnText.innerText = "Save Ticket"; }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracking Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; }
        .toast { transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; transform: translateY(100%); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden bg-gray-100">

    <!-- বাম পাশের মেনুবার -->
    <aside class="w-64 bg-white shadow-xl flex-shrink-0 flex flex-col z-10">
        <div class="p-5 bg-blue-700 text-white text-center shadow-md">
            <h2 class="text-2xl font-bold">Admin Panel</h2>
        </div>
        <nav class="flex-1 p-4 space-y-3 overflow-y-auto mt-2">
            <a id="nav-entry" onclick="switchTab('entry')" class="block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm cursor-pointer transition">
                📝 Ticket Entry
            </a>
            <a id="nav-register" onclick="switchTab('register')" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold cursor-pointer transition">
                📋 Ticket Register
            </a>
            <a id="nav-dashboard" onclick="switchTab('dashboard')" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold cursor-pointer transition">
                📊 Ticket Dashboard
            </a>
        </nav>
        <div class="p-4 border-t text-center text-sm text-gray-400 font-semibold">
            v1.1 • Live Sync
        </div>
    </aside>

    <!-- ডান পাশের মূল কন্টেন্ট -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto relative">
        <div class="max-w-6xl mx-auto pb-10">
            
            <header class="bg-blue-600 text-white rounded-lg p-4 shadow flex justify-between items-center mb-6">
                <h1 id="pageTitle" class="text-xl font-bold">Ticket Entry</h1>
                <span class="bg-green-500 px-3 py-1 rounded-full text-sm font-semibold shadow">Firebase Live</span>
            </header>

            <!-- ১. Ticket Entry Section -->
            <section id="section-entry" class="bg-white rounded-lg shadow p-6 border-t-4 border-blue-600">
                <form id="issueForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Issue ID</label>
                            <input type="text" id="issueId" value="Auto Generated" readonly class="w-full border p-2 rounded bg-gray-200 text-gray-500 cursor-not-allowed font-semibold">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Date Reported *</label>
                            <input type="date" id="dateReported" required class="w-full border p-2 rounded bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Category / Module *</label>
                            <input type="text" id="category" required class="w-full border p-2 rounded bg-gray-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Page / Location</label>
                            <input type="text" id="page" class="w-full border p-2 rounded bg-gray-50 focus:bg-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Issue Description *</label>
                            <textarea id="description" required rows="3" class="w-full border p-2 rounded bg-gray-50 focus:bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Remarks / Resolution</label>
                            <textarea id="remarks" rows="3" class="w-full border p-2 rounded bg-gray-50 focus:bg-white"></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t mt-4">
                        <button type="button" onclick="document.getElementById('issueForm').reset()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300">Clear</button>
                        <button type="submit" id="submitBtn" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 disabled:opacity-50 flex items-center gap-2">
                            <span id="btnText">Save Ticket</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- ২. Ticket Register Section -->
            <section id="section-register" class="hidden-section bg-white rounded-lg shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-blue-50 text-blue-700 text-sm border-b">
                            <tr>
                                <th class="p-3">Ticket ID</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Location/Page</th>
                                <th class="p-3">Description</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y text-sm">
                            <tr><td colspan="5" class="p-8 text-center text-gray-500 font-bold">Loading Data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- ৩. Ticket Dashboard Section -->
            <section id="section-dashboard" class="hidden-section space-y-6">
                <!-- Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                        <h3 class="text-gray-500 font-bold text-sm">TOTAL TICKETS</h3>
                        <p id="dashTotal" class="text-3xl font-black text-blue-600 mt-2">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
                        <h3 class="text-gray-500 font-bold text-sm">LATEST TICKET ID</h3>
                        <p id="dashLatest" class="text-xl font-bold text-green-600 mt-2">-</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow border-l-4 border-purple-500">
                        <h3 class="text-gray-500 font-bold text-sm">TOTAL CATEGORIES</h3>
                        <p id="dashCatCount" class="text-3xl font-black text-purple-600 mt-2">0</p>
                    </div>
                </div>
                
                <!-- Category Breakdown -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="font-bold text-gray-700 border-b pb-2 mb-4">Tickets by Category</h3>
                    <div id="categoryBreakdown" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <!-- JS দিয়ে এখানে ডেটা আসবে -->
                        <p class="text-sm text-gray-500">Loading...</p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Toast Message -->
    <div id="toast" class="toast fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 font-bold">
        Success!
    </div>

    <!-- JavaScript Logic (Tab Switch & Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY",
            authDomain: "project-management-70-8277e.firebaseapp.com",
            projectId: "project-management-70-8277e",
            storageBucket: "project-management-70-8277e.firebasestorage.app",
            messagingSenderId: "178430900706",
            appId: "1:178430900706:web:3085f215cb02b840bfa1bb",
            measurementId: "G-M7KVYNV540"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const issuesCol = collection(db, "issues");

        // Tab Switching Logic (মেনু পরিবর্তন)
        window.switchTab = function(tabName) {
            // Hide all sections
            document.getElementById('section-entry').classList.add('hidden-section');
            document.getElementById('section-register').classList.add('hidden-section');
            document.getElementById('section-dashboard').classList.add('hidden-section');
            
            // Reset Nav Styles
            const navs = ['nav-entry', 'nav-register', 'nav-dashboard'];
            navs.forEach(nav => {
                const el = document.getElementById(nav);
                el.className = "block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold cursor-pointer transition";
            });

            // Show selected section & apply active style
            if(tabName === 'entry') {
                document.getElementById('section-entry').classList.remove('hidden-section');
                document.getElementById('nav-entry').className = "block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm cursor-pointer transition";
                document.getElementById('pageTitle').innerText = "Ticket Entry";
            } else if(tabName === 'register') {
                document.getElementById('section-register').classList.remove('hidden-section');
                document.getElementById('nav-register').className = "block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm cursor-pointer transition";
                document.getElementById('pageTitle').innerText = "Ticket Register";
            } else if(tabName === 'dashboard') {
                document.getElementById('section-dashboard').classList.remove('hidden-section');
                document.getElementById('nav-dashboard').className = "block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm cursor-pointer transition";
                document.getElementById('pageTitle').innerText = "Ticket Dashboard";
            }
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `toast fixed bottom-5 right-5 text-white px-6 py-3 rounded shadow-lg z-50 font-bold ${isError ? 'bg-red-600' : 'bg-green-600'} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Real-time Data Listener for Register & Dashboard
        const q = query(issuesCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let totalTickets = 0;
            let categoriesCount = {};
            let latestId = "-";

            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500 font-bold">No tickets found.</td></tr>`;
                document.getElementById('dashTotal').innerText = "0";
                document.getElementById('dashCatCount').innerText = "0";
                document.getElementById('categoryBreakdown').innerHTML = `<p class="text-sm text-gray-500">No data available</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const issue = doc.data();
                totalTickets++;
                
                // Dashboard calculations
                if(totalTickets === 1) latestId = issue.issueId; 
                let cat = issue.category || 'Unknown';
                categoriesCount[cat] = (categoriesCount[cat] || 0) + 1;

                // Register Table rows
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-700">${issue.issueId}</td>
                    <td class="p-3">${issue.dateReported}</td>
                    <td class="p-3"><span class="bg-gray-200 px-2 py-1 rounded text-xs font-semibold">${cat}</span></td>
                    <td class="p-3">${issue.page || '-'}</td>
                    <td class="p-3 max-w-xs truncate" title="${issue.description}">${issue.description}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update Dashboard UI
            document.getElementById('dashTotal').innerText = totalTickets;
            document.getElementById('dashLatest').innerText = latestId;
            document.getElementById('dashCatCount').innerText = Object.keys(categoriesCount).length;
            
            const catDiv = document.getElementById('categoryBreakdown');
            catDiv.innerHTML = '';
            for (const [key, value] of Object.entries(categoriesCount)) {
                catDiv.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded border border-gray-200 flex justify-between items-center">
                        <span class="font-semibold text-gray-600 text-sm">${key}</span>
                        <span class="bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded text-xs">${value}</span>
                    </div>
                `;
            }
        });

        // Form Submit
        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('btnText').innerText = "Saving...";

            const dateInput = new Date(document.getElementById('dateReported').value);
            const formattedDate = dateInput.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }).replace(/ /g, '-');
            const autoIssueId = "ISS-" + Math.floor(1000 + Math.random() * 9000);

            const payload = {
                issueId: autoIssueId,
                dateReported: formattedDate,
                category: document.getElementById('category').value,
                page: document.getElementById('page').value,
                description: document.getElementById('description').value,
                remarks: document.getElementById('remarks').value,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(issuesCol, payload);
                showToast("Ticket Saved Successfully!");
                document.getElementById('issueForm').reset();
                // ডেটা সেভ হওয়ার পর অটোমেটিক Register পেজে চলে যাওয়ার কমান্ড
                window.switchTab('register'); 
            } catch (err) {
                showToast("Failed to save data.", true);
            } finally {
                btn.disabled = false;
                document.getElementById('btnText').innerText = "Save Ticket";
            }
        });
    </script>
</body>
</html>

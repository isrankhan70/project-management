<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
        .toast { transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; transform: translateY(100%); }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden bg-gray-100">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-xl flex-shrink-0 flex flex-col z-10">
        <div class="p-5 bg-blue-700 text-white text-center shadow-md">
            <h2 class="text-2xl font-bold">Admin Panel</h2>
        </div>
        <nav class="flex-1 p-4 space-y-3 overflow-y-auto mt-2">
            <a href="index.html" class="block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm transition">📝 Ticket Entry</a>
            <a href="register.html" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold transition">📋 Ticket Register</a>
            <a href="dashboard.html" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold transition">📊 Ticket Dashboard</a>
        </nav>
    </aside>

    <!-- Content -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="max-w-6xl mx-auto pb-10">
            <header class="bg-blue-600 text-white rounded-lg p-4 shadow flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">Ticket Entry</h1>
            </header>

            <section class="bg-white rounded-lg shadow p-6 border-t-4 border-blue-600">
                <form id="issueForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="block text-sm font-bold mb-1">Issue ID</label><input type="text" id="issueId" value="Auto Generated" readonly class="w-full border p-2 rounded bg-gray-200"></div>
                        <div><label class="block text-sm font-bold mb-1">Category / Module *</label><input type="text" id="category" required class="w-full border p-2 rounded"></div>
                        <div><label class="block text-sm font-bold mb-1">Page / Location</label><input type="text" id="page" class="w-full border p-2 rounded"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                        <div><label class="block text-sm font-bold mb-1">Raised Date & Time *</label><input type="datetime-local" id="raisedDateTime" required class="w-full border p-2 rounded"></div>
                        <div><label class="block text-sm font-bold mb-1">Respond Date & Time</label><input type="datetime-local" id="respondDateTime" class="w-full border p-2 rounded"></div>
                        <div><label class="block text-sm font-bold mb-1">Solved Date & Time</label><input type="datetime-local" id="solvedDateTime" class="w-full border p-2 rounded"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div><label class="block text-sm font-bold mb-1">Description *</label><textarea id="description" required rows="3" class="w-full border p-2 rounded"></textarea></div>
                        <div><label class="block text-sm font-bold mb-1">Remarks / Resolution</label><textarea id="remarks" rows="3" class="w-full border p-2 rounded"></textarea></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div><label class="block text-sm font-bold mb-1">Entry By (Name) *</label><input type="text" id="entryBy" required class="w-full border p-2 rounded"></div>        
                    </div>

                    <div class="flex justify-end pt-4 border-t mt-4">
                        <button type="submit" id="submitBtn" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Save Ticket</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div id="toast" class="toast fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 font-bold">Success!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY",
            authDomain: "project-management-70-8277e.firebaseapp.com",
            projectId: "project-management-70-8277e",
            storageBucket: "project-management-70-8277e.firebasestorage.app",
            messagingSenderId: "178430900706",
            appId: "1:178430900706:web:3085f215cb02b840bfa1bb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const issuesCol = collection(db, "issues");

        document.getElementById('issueForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "Uploading & Saving...";
            
            const autoIssueId = "ISS-" + Math.floor(1000 + Math.random() * 9000);
            
            // Auto Capture Entry DateTime
            const now = new Date();
            const entryDateTime = now.toLocaleString('en-GB');

            // Handle File Upload
            let attachmentUrl = "";
            const fileInput = document.getElementById('attachment').files[0];
            if (fileInput) {
                const storageRef = ref(storage, 'attachments/' + now.getTime() + '_' + fileInput.name);
                await uploadBytes(storageRef, fileInput);
                attachmentUrl = await getDownloadURL(storageRef);
            }

            try {
                await addDoc(issuesCol, {
                    issueId: autoIssueId,
                    category: document.getElementById('category').value,
                    page: document.getElementById('page').value,
                    raisedDateTime: document.getElementById('raisedDateTime').value.replace('T', ' '),
                    respondDateTime: document.getElementById('respondDateTime').value.replace('T', ' ') || "-",
                    solvedDateTime: document.getElementById('solvedDateTime').value.replace('T', ' ') || "-",
                    description: document.getElementById('description').value,
                    remarks: document.getElementById('remarks').value,
                    entryBy: document.getElementById('entryBy').value,
                    entryDateTime: entryDateTime,
                    attachmentUrl: attachmentUrl,
                    createdAt: serverTimestamp()
                });
                
                const toast = document.getElementById('toast'); toast.className = "toast fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-lg z-50 font-bold show";
                setTimeout(() => toast.classList.remove('show'), 3000);
                document.getElementById('issueForm').reset();
                window.location.href = "register.html";
            } catch (err) { alert("Error saving data! Check Firebase Rules."); console.error(err); }
            btn.disabled = false; btn.innerText = "Save Ticket";
        });
    </script>
</body>
</html>

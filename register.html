<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Register - ERP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Custom ERP Theme Colors */
        .bg-sidebar { background-color: #0b5e5e; }
        .bg-sidebar-hover { background-color: #084949; }
        .text-sidebar-text { color: #a1caca; }
        .dropdown-menu { display: none; }
        .dropdown-menu.open { display: block; }
    </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50 font-sans hidden" id="mainContent">

    <!-- 1. Left Sidebar (ERP Style) -->
    <aside class="w-64 bg-sidebar text-white shadow-xl flex-shrink-0 flex flex-col z-20 transition-all duration-300">
        
        <!-- User Profile Section -->
        <div class="p-4 border-b border-gray-600 flex items-center gap-3 bg-sidebar-hover cursor-pointer">
            <img src="https://ui-avatars.com/api/?name=Admin+User&background=ffffff&color=0b5e5e&rounded=true" alt="User" class="w-10 h-10 rounded-full border-2 border-white">
            <div>
                <h3 id="userEmailDisplay" class="font-bold text-sm truncate w-40">Loading...</h3>
                <p class="text-xs text-sidebar-text">Administrator</p>
            </div>
            <i class="fa-solid fa-chevron-down text-xs ml-auto"></i>
        </div>

        <div class="px-4 py-2 text-xs font-bold text-sidebar-text tracking-wider mt-2">MENU</div>

        <!-- Navigation Links with Dropdowns -->
        <nav class="flex-1 overflow-y-auto pb-4">
            
            <!-- Dashboard Link -->
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-sidebar-text hover:text-white hover:bg-sidebar-hover transition">
                <i class="fa-solid fa-house w-5 text-center"></i>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>

            <!-- Admin Dropdown (Open by default since we are in Ticket Register) -->
            <div class="nav-item">
                <button onclick="toggleDropdown('adminMenu', this)" class="w-full flex items-center justify-between px-4 py-3 hover:text-white hover:bg-sidebar-hover transition text-white bg-sidebar-hover">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-users-gear w-5 text-center"></i>
                        <span class="font-semibold text-sm">Ticket</span>
                    </div>
                    <i class="fa-solid fa-angle-down text-xs transition-transform duration-200" style="transform: rotate(180deg);"></i>
                </button>
                <div id="adminMenu" class="dropdown-menu bg-sidebar-hover pl-12 py-1 open">
                    <a href="index.html" class="block py-2 text-sm text-sidebar-text hover:text-white">📝 Ticket Entry</a>
                    <!-- Active Link Styling for Register -->
                    <a href="register.html" class="block py-2 text-sm text-white font-bold border-l-2 border-white pl-2 ml-[-10px]">📋 Ticket Register</a>
                </div>
            </div>
            
        </nav>
    </aside>

    <!-- 2. Right Side Content Area -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        
        <!-- Top Navbar -->
        <header class="bg-white h-14 border-b flex items-center justify-between px-4 shadow-sm z-10 shrink-0">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500">
                <i class="fa-solid fa-house"></i>
                <i class="fa-solid fa-chevron-right text-xs"></i>
                <span>Ticket</span>
                <i class="fa-solid fa-chevron-right text-xs"></i>
                <span class="font-semibold text-gray-700">Ticket Register</span>
            </div>
            
            <!-- Right Icons & Logout -->
            <div class="flex items-center gap-4">
                <button class="text-gray-500 hover:text-gray-700 relative">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1 rounded-full">3</span>
                </button>
                <button class="text-gray-500 hover:text-gray-700"><i class="fa-solid fa-expand text-lg"></i></button>
                <button class="text-gray-500 hover:text-gray-700"><i class="fa-solid fa-gear text-lg"></i></button>
                <div class="border-l pl-4 border-gray-300">
                    <button id="logoutBtn" class="bg-gray-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-sm font-bold transition flex items-center gap-2">
                        <i class="fa-solid fa-power-off"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Table Content Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="w-full max-w-full mx-auto">
                
                <!-- Table Header Panel -->
                <div class="bg-white p-5 rounded-t-lg shadow-sm border border-gray-200 border-b-0 flex items-center justify-between border-t-4 border-t-[#0b5e5e]">
                    <div class="flex items-center gap-3">
                        <div class="bg-[#e6f2f2] p-2 rounded-lg text-[#0b5e5e]">
                            <i class="fa-solid fa-table-list text-xl"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Ticket Register Log</h2>
                            <p class="text-xs text-gray-500">Live tracker of all submitted Tickets and their current status.</p>
                        </div>
                    </div>
                    <a href="index.html" class="px-4 py-2 bg-[#0b5e5e] text-white rounded text-sm font-bold hover:bg-[#084949] shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> New Ticket
                    </a>
                </div>

                <!-- Date Filter & Export Bar -->
                <div class="bg-gray-50 p-4 border border-x-gray-200 border-t-0 flex flex-wrap items-end justify-between gap-4 border-b border-gray-200">
                    <div class="flex flex-wrap items-end gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">From Raised Date</label>
                            <input type="date" id="fromDate" class="border border-gray-300 p-2 rounded text-

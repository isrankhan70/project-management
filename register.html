<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden bg-gray-100">

    <aside class="w-64 bg-white shadow-xl flex-shrink-0 flex flex-col z-10">
        <div class="p-5 bg-blue-700 text-white text-center shadow-md">
            <h2 class="text-2xl font-bold">Admin Panel</h2>
        </div>
        <nav class="flex-1 p-4 space-y-3 overflow-y-auto mt-2">
            <a href="index.html" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold transition">📝 Ticket Entry</a>
            <a href="register.html" class="block px-4 py-3 rounded bg-blue-50 text-blue-700 font-bold border-l-4 border-blue-600 shadow-sm transition">📋 Ticket Register</a>
            <a href="dashboard.html" class="block px-4 py-3 rounded text-gray-600 hover:bg-blue-50 hover:text-blue-600 font-semibold transition">📊 Ticket Dashboard</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="max-w-7xl mx-auto pb-10">
            <header class="bg-blue-600 text-white rounded-lg p-4 shadow flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">Ticket Register</h1>
            </header>

            <section class="bg-white rounded-lg shadow overflow-hidden overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-blue-50 text-blue-700 text-sm border-b">
                        <tr>
                            <th class="p-3">Issue ID</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Raised Time</th>
                            <th class="p-3">Entry By</th>
                            <th class="p-3">Status / Solved</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-gray-500 font-bold">Loading Data...</td></tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY", projectId: "project-management-70-8277e"
        });
        const db = getFirestore(app);

        onSnapshot(query(collection(db, "issues"), orderBy("createdAt", "desc")), (snapshot) => {
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (snapshot.empty) return tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center">No data found</td></tr>`;
            
            snapshot.forEach((doc) => {
                const issue = doc.data();
                
                let solvedStatus = issue.solvedDateTime !== "-" ? `<span class="text-green-600 font-bold">Solved</span><br><span class="text-xs text-gray-500">${issue.solvedDateTime}</span>` : `<span class="text-yellow-600 font-bold">Pending</span>`;

                tbody.innerHTML += `<tr>
                    <td class="p-3 font-bold">${issue.issueId}</td>
                    <td class="p-3"><span class="bg-gray-200 px-2 py-1 rounded text-xs">${issue.category}</span></td>
                    <td class="p-3">${issue.raisedDateTime}</td>
                    <td class="p-3">${issue.entryBy}<br><span class="text-xs text-gray-500">${issue.entryDateTime}</span></td>
                    <td class="p-3">${solvedStatus}</td>
                </tr>`;
            });
        });
    </script>
</body>
</html>

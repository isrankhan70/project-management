<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Dashboard - Issue Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> .bg-sidebar { background-color: #0b5e5e; } .bg-sidebar-hover { background-color: #084949; } </style>
</head>
<body class="flex h-screen overflow-hidden bg-gray-100 font-sans hidden" id="mainContent">

    <aside class="w-64 bg-sidebar text-white shadow-xl flex-shrink-0 flex flex-col z-20">
        <div class="p-4 border-b border-gray-600 flex items-center gap-3 bg-sidebar-hover">
            <div class="w-10 h-10 rounded-full bg-white text-[#0b5e5e] flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-user"></i></div>
            <div><h3 id="userEmailDisplay" class="font-bold text-sm truncate w-40">Loading...</h3></div>
        </div>
        <div class="px-4 py-2 text-xs font-bold text-[#a1caca] tracking-wider mt-2">MENU</div>
        <nav class="flex-1 overflow-y-auto pb-4">
            <a href="dashboard.html" class="block px-4 py-3 text-white font-bold border-l-4 border-white bg-sidebar-hover"><i class="fa-solid fa-house w-5"></i> Dashboard</a>
            <a href="index.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-plus w-5"></i> Ticket Entry</a>
            <a href="register.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-list w-5"></i> Ticket Register</a>
            <a href="permissions.html" class="block px-4 py-3 text-[#a1caca] hover:text-white hover:bg-sidebar-hover transition"><i class="fa-solid fa-lock w-5"></i> Permissions</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="bg-white h-14 border-b flex items-center justify-between px-4 shadow-sm z-10 shrink-0">
            <div class="flex items-center gap-2 text-sm text-gray-500"><i class="fa-solid fa-house"></i><i class="fa-solid fa-chevron-right text-xs"></i><span class="font-semibold text-gray-700">Dashboard</span></div>
            <button id="logoutBtn" class="bg-gray-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-sm font-bold transition">Logout</button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-2xl font-bold text-gray-800">Welcome to ERP System</h2>
                    <p class="text-gray-500 mt-1">Manage your issues, resources, and modules from here.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                        <div><h3 class="text-gray-500 font-bold text-xs mb-1">TOTAL TICKETS</h3><p id="dashTotal" class="text-2xl font-black text-gray-800">0</p></div>
                        <i class="fa-solid fa-ticket text-3xl text-blue-100"></i>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-green-500 flex justify-between items-center">
                        <div><h3 class="text-gray-500 font-bold text-xs mb-1">LATEST ISSUE</h3><p id="dashLatest" class="text-xl font-bold text-gray-800">-</p></div>
                        <i class="fa-solid fa-clock-rotate-left text-3xl text-green-100"></i>
                    </div>
                    <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-yellow-500 flex justify-between items-center">
                        <div><h3 class="text-gray-500 font-bold text-xs mb-1">PENDING TICKETS</h3><p id="dashPending" class="text-2xl font-black text-gray-800">0</p></div>
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-yellow-100"></i>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDjv4YnJeqiqxIV2sGqa_Fs_T8pZEjqXpY", projectId: "project-management-70-8277e" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Page Lock Logic
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.replace("login.html"); return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().permissions && userDoc.data().permissions.dashboard === true) {
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
            } else {
                alert("System Access Denied: You do not have permission to view the Dashboard.");
                window.location.replace("login.html");
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth).then(() => { window.location.replace("login.html"); }); });

        // Load Dashboard Stats
        onSnapshot(query(collection(db, "issues"), orderBy("createdAt", "desc")), (snapshot) => {
            let total = 0, latest = "-", pendingCount = 0;
            snapshot.forEach((doc) => {
                const data = doc.data();
                total++;
                if (total === 1) latest = data.issueId;
                if (!data.solvedDateTime || data.solvedDateTime === "-") pendingCount++;
            });
            document.getElementById('dashTotal').innerText = total;
            document.getElementById('dashLatest').innerText = latest;
            document.getElementById('dashPending').innerText = pendingCount;
        });
    </script>
</body>
</html>
